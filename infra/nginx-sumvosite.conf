# sumvo.site: site Hugo ở /var/www/sumvosite/site, trang cần đăng nhập ở /var/www/sumvosite/private.
# Mọi request vô /maotrungwork/ và /edm/ hỏi workgate (127.0.0.1:8090) trước: 401 thì đi đăng nhập Google, 403 thì báo chưa được chia sẻ.
# Thêm mục cần đăng nhập: thêm vô regex bên dưới và PROTECTED_PREFIXES của workgate.
# setup-sumvosite.sh chép file này vô /etc/nginx/snippets/sumvosite.conf. Vhost khai zone sumvosite_auth.
root /var/www/sumvosite/site;
error_page 404 /404.html;

location = /_auth/check {
    internal;
    proxy_pass http://127.0.0.1:8090;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
}

location ^~ /_auth/ {
    limit_req zone=sumvosite_auth burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header X-Real-IP $remote_addr;
}

location ~ ^/(maotrungwork|edm)$ {
    return 301 $uri/;
}

# Trang đầu: workgate liệt kê các trang được chia sẻ với người đang đăng nhập
location = /maotrungwork/ {
    rewrite ^ /_auth/home break;
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header X-Real-IP $remote_addr;
}

# Regex đặt trước static-site.conf nên thắng các location ảnh, css, js trong đó
location ~ ^/(maotrungwork|edm)/ {
    root /var/www/sumvosite/private;
    auth_request /_auth/check;
    error_page 401 = @workgate_login;
    error_page 403 = @workgate_denied;
    error_page 404 /404.html;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include snippets/security-headers.conf;
    try_files $uri $uri/ =404;
}

location @workgate_login {
    rewrite ^ /_auth/start break;
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
}

location @workgate_denied {
    rewrite ^ /_auth/denied break;
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
}

include snippets/static-site.conf;
